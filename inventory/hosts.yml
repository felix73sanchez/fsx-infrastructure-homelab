---
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    timezone: "America/Santo_Domingo"
    locale: "en_US.UTF-8"
    admin_user: fsxserver
    admin_groups:
      - sudo
      - docker
    ssh_port: 22
    ssh_permit_root_login: "no"
    ssh_password_authentication: "no"
    ssh_pubkey_authentication: "yes"
    enable_ufw: true
    enable_fail2ban: true
    fail2ban_maxretry: 5
    fail2ban_bantime: 3600
    firewall_allowed_tcp_ports:
      - 22
    enable_unattended_upgrades: true
    auto_reboot: false
    auto_reboot_time: "03:00"
    base_packages:
      - vim
      - curl
      - wget
      - git
      - htop
      - net-tools
      - dnsutils
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    docker_install: true
    docker_edition: ce
    docker_package_state: present
    docker_service_state: started
    docker_service_enabled: true
    monitoring_enabled: false
    log_retention_days: 30
    motd_enabled: true
    motd_show_system_info: true
    
  children:
    homelab:
      vars:
        environment: homelab
        datacenter: home
        homelab_network: "10.0.0.0/24"
        homelab_gateway: "10.0.0.1"
        homelab_dns_servers:
          - 1.1.1.1
          - 8.8.8.8
        docker_network_subnet: "172.20.0.0/16"
        ntp_servers:
          - 0.pool.ntp.org
          - 1.pool.ntp.org
        log_level: info
        backup_enabled: true
        backup_schedule: "0 2 * * *"
        default_container_memory_limit: "512m"
        default_container_cpu_limit: "1"
        
      children:
        # Main servers
        servers:
          hosts:
            mirtha:
              ansible_host: 10.0.0.73
              server_role: primary
              backup_enabled: true
              monitoring_enabled: true
              
        # Future: Docker Swarm managers
        swarm_managers:
          hosts:
            # mirtha:
            #   ansible_host: 10.0.0.73
            
        # Future: Docker Swarm workers
        swarm_workers:
          hosts:
            # Add worker nodes here
            
        # Future: Kubernetes cluster
        k8s_cluster:
          children:
            k8s_masters:
              hosts:
                # Add k8s master nodes
            k8s_workers:
              hosts:
                # Add k8s worker nodes
                
        # Future: Database servers
        databases:
          hosts:
            # Add dedicated DB servers
            
        # Future: Storage nodes
        storage:
          hosts:
            # Add NAS/storage nodes
