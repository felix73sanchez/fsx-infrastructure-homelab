---
# Security hardening tasks (multi-distro)

# ── SSH hardening (universal) ──
- name: Configure SSH - Disable root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin {{ ssh_permit_root_login }}'
    state: present
  notify: restart sshd
  tags: ['ssh']

- name: Configure SSH - Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication {{ ssh_password_authentication }}'
    state: present
  notify: restart sshd
  tags: ['ssh']

- name: Configure SSH - Enable pubkey authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication {{ ssh_pubkey_authentication }}'
    state: present
  notify: restart sshd
  tags: ['ssh']

- name: Configure SSH - Disable empty passwords
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
    state: present
  notify: restart sshd
  tags: ['ssh']

- name: Configure SSH - Set client alive interval
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveInterval'
    line: 'ClientAliveInterval 300'
    state: present
  notify: restart sshd
  tags: ['ssh']

# ── Firewall: UFW (Debian) ──
- name: UFW - Install
  package:
    name: ufw
    state: present
  when: firewall_engine == 'ufw'
  tags: ['firewall']

- name: UFW - Default deny incoming
  ufw:
    direction: incoming
    policy: deny
  when: firewall_engine == 'ufw'
  tags: ['firewall']

- name: UFW - Default allow outgoing
  ufw:
    direction: outgoing
    policy: allow
  when: firewall_engine == 'ufw'
  tags: ['firewall']

- name: UFW - Allow SSH
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: firewall_engine == 'ufw'
  tags: ['firewall']

- name: UFW - Allow TCP ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"
  when:
    - firewall_engine == 'ufw'
    - firewall_allowed_tcp_ports is defined
  tags: ['firewall']

- name: UFW - Allow UDP ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports }}"
  when:
    - firewall_engine == 'ufw'
    - firewall_allowed_udp_ports is defined
  tags: ['firewall']

- name: UFW - Enable
  ufw:
    state: enabled
  when: firewall_engine == 'ufw'
  tags: ['firewall']

# ── Firewall: firewalld (RedHat) ──
- name: firewalld - Install
  package:
    name: firewalld
    state: present
  when: firewall_engine == 'firewalld'
  tags: ['firewall']

- name: firewalld - Ensure running
  service:
    name: firewalld
    state: started
    enabled: yes
  when: firewall_engine == 'firewalld'
  tags: ['firewall']

- name: firewalld - Set default zone to drop
  command: firewall-cmd --set-default-zone=drop
  when: firewall_engine == 'firewalld'
  changed_when: false
  tags: ['firewall']

- name: firewalld - Allow SSH
  firewalld:
    service: ssh
    zone: public
    permanent: yes
    state: enabled
    immediate: yes
  when: firewall_engine == 'firewalld'
  tags: ['firewall']

- name: firewalld - Allow TCP ports
  firewalld:
    port: "{{ item }}/tcp"
    zone: public
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_allowed_tcp_ports }}"
  when:
    - firewall_engine == 'firewalld'
    - firewall_allowed_tcp_ports is defined
  tags: ['firewall']

- name: firewalld - Allow UDP ports
  firewalld:
    port: "{{ item }}/udp"
    zone: public
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ firewall_allowed_udp_ports }}"
  when:
    - firewall_engine == 'firewalld'
    - firewall_allowed_udp_ports is defined
  tags: ['firewall']

# ── fail2ban (universal) ──
- name: Install fail2ban
  package:
    name: fail2ban
    state: present
  when: enable_fail2ban | default(true)
  tags: ['fail2ban']

- name: Configure fail2ban for SSH
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  when: enable_fail2ban | default(true)
  notify: restart fail2ban
  tags: ['fail2ban']

- name: Start and enable fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes
  when: enable_fail2ban | default(true)
  tags: ['fail2ban']

# ── Service hardening (universal) ──
- name: Disable unnecessary services
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - bluetooth
    - cups
  ignore_errors: yes
  tags: ['services']

# ── File permissions (universal) ──
- name: Set secure permissions on sensitive files
  file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - /etc/ssh/sshd_config
    - /etc/shadow
  tags: ['permissions']
